<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markedsplass — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      padding: 1.5rem;
      text-align: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 3rem;
      letter-spacing: -0.02em;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: #2563eb;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #64748b;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:active { background: #1e40af; }
    .btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="logo">Markedsplass</div>

  <div class="icon-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m3 3 2.26 2.26M21 21l-2.26-2.26M15.75 9A3.75 3.75 0 1 1 9 5.56M5.26 5.26A9 9 0 0 0 3 12c0 4.97 4.03 9 9 9a9 9 0 0 0 6.74-3.026M5.26 5.26l13.48 13.48M8.56 3.44A9 9 0 0 1 21 12c0 2.04-.68 3.93-1.82 5.44" />
    </svg>
  </div>

  <h1>Du er offline</h1>
  <p>Sjekk nettverkstilkoblingen din og pr&oslash;v igjen.</p>

  <button class="btn" onclick="location.reload()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
    </svg>
    Pr&oslash;v igjen
  </button>
</body>
</html>
